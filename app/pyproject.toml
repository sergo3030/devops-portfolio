[project]
name = "portfolio-api"
version = "0.0.0"
description = "FastAPI service for the portfolio (placeholder until task 10)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
