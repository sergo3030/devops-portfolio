# Hooks use locally installed binaries (no Go or Docker needed on Windows).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: hadolint
        name: hadolint (Dockerfile)
        entry: hadolint
        language: system
        files: ^app/Dockerfile$
      - id: content-check
        name: content checks incl. private denylist
        entry: uv run --project app python scripts/check_content.py
        language: system
        files: ^(content/|scripts/check_content\.py)
        pass_filenames: false
