[project]
name = "portfolio-ci-tools"
version = "0.0.0"
description = "Python command line tools that CI and `just` run. Locked, so installs are hash-checked and Dependabot can update them."
requires-python = ">=3.13"
dependencies = [
  "actionlint-py==1.7.12.25",
  "check-jsonschema==0.38.2",
  "checkov==3.3.29",
  "shellcheck-py==0.11.0.1",
  "zizmor==1.31.1",
]

[tool.uv]
package = false
