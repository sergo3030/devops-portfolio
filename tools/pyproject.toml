[project]
name = "portfolio-ci-tools"
version = "0.0.0"
description = "Python command line tools that CI and `just` run. Locked, so installs are hash-checked and Dependabot can update them."
requires-python = ">=3.13"
dependencies = [
  "actionlint-py==1.7.12.25",
  "check-jsonschema==0.39.0",
  "checkov==3.3.30",
  "shellcheck-py==0.11.0.1",
  "zizmor==1.31.1",
]

[tool.uv]
package = false
# checkov pins asteval==1.0.6 (every release, the newest 3.4.3 included). That version has two sandbox
# escapes, GHSA-89v8-rhwq-hf77 and GHSA-9w56-46f6-3qhx, fixed in 1.0.9. The override lets the lock
# file use the fixed version. Remove it when checkov depends on asteval 1.0.9 or newer.
override-dependencies = ["asteval>=1.0.9"]
