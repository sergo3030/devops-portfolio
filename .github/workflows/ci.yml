name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        run: uvx zizmor@1.30.1 --offline --config .github/zizmor.yml .

      - name: Account ID must come from the masked secret
        run: |
          # A variable or a hardcoded ARN would print the account ID in public logs.
          if grep -rnE 'vars\.AWS_ACCOUNT_ID|arn:aws:[a-z0-9-]*::[0-9]{12}' --exclude=ci.yml .github/workflows; then
            echo "use secrets.AWS_ACCOUNT_ID, never a variable or a literal ARN" >&2
            exit 1
          fi

      - name: dependabot.yml schema
        run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.dependabot .github/dependabot.yml

  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose

  iac:
    name: iac (checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: checkov
        run: uvx --from checkov==3.3.26 checkov --config-file .checkov.yaml

  opentofu:
    name: opentofu (fmt, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff infra

      - name: Repository must keep prevent_destroy
        run: grep -q 'prevent_destroy = true' infra/github/repository.tf

      - name: Required checks must match the CI job names
        run: bash scripts/check-required-checks.sh

      - name: Validate and test each root (no credentials needed)
        run: |
          for root in infra/bootstrap infra/github; do
            echo "::group::${root}"
            tofu -chdir="${root}" init -backend=false -input=false
            tofu -chdir="${root}" validate
            tofu -chdir="${root}" test
            echo "::endgroup::"
          done
