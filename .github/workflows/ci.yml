name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        run: uvx zizmor@1.30.1 --offline --config .github/zizmor.yml .

      - name: Account ID must come from the masked secret
        run: |
          # A variable or a hardcoded ARN would print the account ID in public logs.
          if grep -rnE 'vars\.AWS_ACCOUNT_ID|arn:aws:[a-z0-9-]*::[0-9]{12}' --exclude=ci.yml .github/workflows; then
            echo "use secrets.AWS_ACCOUNT_ID, never a variable or a literal ARN" >&2
            exit 1
          fi

      - name: dependabot.yml schema
        run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Script tests (fake aws, docker and trivy)
        run: |
          bash scripts/test-ecr-image.sh
          bash scripts/test-retry-and-trivy.sh
          bash scripts/test-check-release.sh
          bash scripts/test-check-site-link.sh

  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check . ../scripts

      - name: ruff format
        run: uv run ruff format --check . ../scripts

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Content checks (schema, leak patterns, numbers)
        working-directory: .
        # The private denylist is not available in CI by design. It runs locally and in
        # the pre-commit hook. The checks and their planted-violation tests run here.
        run: uv run --project app python scripts/check_content.py --allow-missing-denylist --build "${RUNNER_TEMP}/public-content.json"

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose

  iac:
    name: iac (checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: checkov
        run: uvx --from checkov==3.3.26 checkov --config-file .checkov.yaml

  opentofu:
    name: opentofu (fmt, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff infra

      - name: Repository must keep prevent_destroy
        run: grep -q 'prevent_destroy = true' infra/github/repository.tf

      - name: Required checks must match the CI job names
        run: bash scripts/check-required-checks.sh

      - name: Validate and test each root (no credentials needed)
        run: |
          for root in infra/bootstrap infra/github infra/prod; do
            echo "::group::${root}"
            tofu -chdir="${root}" init -backend=false -input=false
            tofu -chdir="${root}" validate
            tofu -chdir="${root}" test
            echo "::endgroup::"
          done

  image:
    name: image (hadolint, build, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # default, stated for clarity
      id-token: write # trade the OIDC token for AWS credentials, to log in to public ECR (D40)
    env:
      # BuildKit adds provenance attestations by default in some setups. Lambda rejects an
      # image index, so switch them off for every build in this job.
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      APP_VERSION: "0.0.0-dev"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The adapter image comes from public.ecr.aws, which rate limits anonymous pulls per address
      # and answers 429 to the shared runners. A pull request of this repository logs in with the
      # read-only plan role instead (no stored credentials). If any of this fails, the pull is
      # anonymous as before, so the build never depends on it.
      - name: Assume the plan role (for authenticated pulls from public ECR)
        id: aws
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A secret on purpose: GitHub masks it everywhere in the public logs.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-plan
          role-session-name: image-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to public ECR
        if: steps.aws.outcome == 'success'
        run: bash scripts/ecr-public-login.sh

      - name: Install hadolint 2.15.1 (checksum pinned)
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          chmod +x hadolint
          ./hadolint --version

      - name: hadolint
        run: ./hadolint app/Dockerfile

      - name: Build the image and start the stack
        env:
          GIT_SHA: ${{ github.sha }}
        # public.ecr.aws and ghcr.io sometimes answer 429 to the shared runners, so the pull is retried.
        run: bash scripts/retry.sh 3 30 -- docker compose up --build --detach --wait --wait-timeout 90

      - name: Smoke test
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/smoke-test-container.sh

      - name: Install Trivy (checksum pinned)
        run: bash scripts/install-trivy.sh

      - name: Scan the image (fixable HIGH and CRITICAL vulnerabilities, secrets)
        run: bash scripts/scan-image.sh portfolio-api:ci

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  e2e:
    name: e2e (stack, site)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # default, stated for clarity
      id-token: write # trade the OIDC token for AWS credentials, to log in to public ECR (D40)
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      APP_VERSION: "0.0.0-dev"
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same authenticated pull of the adapter image as the image job (see there, D40).
      - name: Assume the plan role (for authenticated pulls from public ECR)
        id: aws
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-plan
          role-session-name: e2e-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to public ECR
        if: steps.aws.outcome == 'success'
        run: bash scripts/ecr-public-login.sh

      - name: Build the image and start the stack (CORS allows the site under test)
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/retry.sh 3 30 -- docker compose up --build --detach --wait --wait-timeout 90

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Build the content snapshot the site embeds
        run: uv run --locked --project app --only-group content python scripts/check_content.py --allow-missing-denylist --build web/src/generated/content.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: Install (exact versions from the lock file, no install scripts)
        working-directory: web
        run: npm ci

      # Playwright drives the Google Chrome that the runner image already has: nothing is downloaded.
      - name: End-to-end test in a real browser
        working-directory: web
        run: npm run e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  web:
    name: web (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Build the content snapshot the site embeds
        working-directory: .
        run: uv run --locked --project app --only-group content python scripts/check_content.py --allow-missing-denylist --build web/src/generated/content.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: Install (exact versions from the lock file, no install scripts)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format

      - name: TypeScript (types are generated from the API contract first)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:size

      - name: The built page is wired to the API and its policy allows it
        run: npm run check:page

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev
