name: build

# Builds the API image from main by hand (Actions, Run workflow, `main`) and pushes it to ECR
# (image.yml). It does not run on a merge and it offers no deployment: since D55 a deployment
# comes only from a release (release.yml, which waits for the owner's approval) or from a manual
# deploy.yml run with a digest. Its one use is `just up-prod`, which needs a first image in a
# fresh repository. The image is tagged sha-<commit> and reports version 0.0.0-dev.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      id-token: write # passed on to image.yml, which trades it for AWS credentials
    with:
      commit: ${{ github.sha }}
      version: "0.0.0-dev"
      image_tag: sha-${{ github.sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
