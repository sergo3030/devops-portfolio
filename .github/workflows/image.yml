name: image

# Builds the API image for one commit and pushes it to ECR through the ecr-push role. Called by
# build.yml (every merge to main, version 0.0.0-dev) and by release.yml (a release, version x.y.z).
#
# The image is smoke-tested and scanned with Trivy first, and the one that passed is the one that is
# pushed: an image with a fixable HIGH or CRITICAL vulnerability, or a secret, never reaches ECR.
# The tags are immutable. An image that already has the main tag is reused, never rebuilt, and the
# extra tags are added to that image, so a run can be repeated safely. The job reports the digest
# that deploy.yml uses.

on:
  workflow_call:
    inputs:
      commit:
        description: "The full commit hash to build (also reported by /health as git_sha)"
        required: true
        type: string
      version:
        description: "The version to bake into the image (0.0.0-dev, or x.y.z for a release)"
        required: false
        type: string
        default: "0.0.0-dev"
      image_tag:
        description: "The main image tag (sha-<commit>, or v<version> for a release)"
        required: true
        type: string
      extra_tags:
        description: "More tags for the same image, separated by spaces"
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCOUNT_ID:
        description: "AWS account ID, used to build the role ARN (a secret so that GitHub masks it)"
        required: true
    outputs:
      digest:
        description: "The digest of the image in ECR"
        value: ${{ jobs.image.outputs.digest }}
      tag:
        description: "The main tag of the image"
        value: ${{ jobs.image.outputs.tag }}

permissions:
  contents: read

jobs:
  image:
    name: build (image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.report.outputs.digest }}
      tag: ${{ steps.report.outputs.tag }}
    permissions:
      contents: read # default, stated for clarity
      id-token: write # trade the OIDC token for AWS credentials, nothing else
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: portfolio-api
      GIT_SHA: ${{ inputs.commit }}
      APP_VERSION: ${{ inputs.version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      EXTRA_TAGS: ${{ inputs.extra_tags }}
      # Lambda rejects an image index, so switch provenance attestations off.
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - name: Check out the commit that is built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Assume the ecr-push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A secret on purpose: GitHub masks it everywhere in the public logs.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-ecr-push
          role-session-name: image-${{ github.run_id }}
          aws-region: us-east-1

      - name: Is there already an image with this tag?
        id: existing
        run: bash scripts/ecr-image.sh lookup

      # The adapter image comes from public.ecr.aws, which rate limits anonymous pulls. This job
      # already has AWS credentials, so it logs in (D40). If the login fails, the pull is anonymous.
      - name: Log in to public ECR (authenticated pulls)
        if: steps.existing.outputs.found != 'true'
        run: bash scripts/ecr-public-login.sh

      - name: Build the image and start the stack
        if: steps.existing.outputs.found != 'true'
        # public.ecr.aws and ghcr.io sometimes answer 429 to the shared runners, so the pull is retried.
        run: bash scripts/retry.sh 3 30 -- docker compose up --build --detach --wait --wait-timeout 90

      - name: Smoke test
        if: steps.existing.outputs.found != 'true'
        run: bash scripts/smoke-test-container.sh

      - name: Install Trivy (checksum pinned)
        if: steps.existing.outputs.found != 'true'
        run: bash scripts/install-trivy.sh

      - name: Scan the image (fixable HIGH and CRITICAL vulnerabilities, secrets)
        if: steps.existing.outputs.found != 'true'
        run: bash scripts/scan-image.sh portfolio-api:ci

      - name: Push the image that passed the smoke test and the scan
        if: steps.existing.outputs.found != 'true'
        env:
          # The registry host contains the account ID, which GitHub masks because it is a secret.
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" bash scripts/ecr-image.sh push

      - name: Add the extra tags (safe to repeat)
        run: bash scripts/ecr-image.sh extra-tags

      - name: Report the digest ECR holds
        id: report
        run: bash scripts/ecr-image.sh report

      - name: Container logs on failure
        if: failure() && steps.existing.outputs.found != 'true'
        run: docker compose logs --no-color

      - name: Tear down
        if: always() && steps.existing.outputs.found != 'true'
        run: docker compose down --volumes
