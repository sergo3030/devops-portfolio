name: oidc-claims

# TEMPORARY diagnostic (task 8a). It prints the non-secret claims of the GitHub OIDC
# token, so the AWS trust policies can match the real `sub` formats. The token
# itself is never printed. This workflow is removed again once the formats are
# recorded in docs/decisions.md.

on:
  pull_request:
    paths:
      - ".github/workflows/oidc-claims.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oidc-claims.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-claims-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event:
    name: claims (no environment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write # request the OIDC token, nothing else
      contents: read # default, stated for clarity
    steps:
      - name: Print claims
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          printf '%s' "${payload}" | base64 -d | jq '{sub, aud, iss, event_name, ref, ref_type, environment, repository, repository_id, repository_owner_id, job_workflow_ref}'

  prod:
    name: claims (environment prod)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod # waits for the owner's approval
    permissions:
      id-token: write # request the OIDC token, nothing else
      contents: read # default, stated for clarity
    steps:
      - name: Print claims
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          printf '%s' "${payload}" | base64 -d | jq '{sub, aud, iss, event_name, ref, ref_type, environment, repository, repository_id, repository_owner_id, job_workflow_ref}'
