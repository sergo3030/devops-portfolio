name: pages

# Builds the static site and publishes it to GitHub Pages. It runs after a merge to main
# (never for a pull request: Pages deployments are limited to main by the github-pages
# environment) and on demand. The built page is compared byte for byte with what is served.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "content/**"
      - "scripts/verify-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (site)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      index_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Build the content snapshot the site embeds (approved lines only)
        # The private denylist is not available in CI. It runs on the owner's machine.
        run: uv run --locked --project app --only-group content python scripts/check_content.py --allow-missing-denylist --build web/src/generated/content.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: Install (exact versions from the lock file, no install scripts)
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Bundle size budget
        working-directory: web
        run: npm run check:size

      - name: Fingerprint the page that was built
        id: hash
        run: echo "sha256=$(sha256sum web/dist/index.html | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: deploy (github-pages)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read # to check out the verify script
      pages: write # publish the site
      id-token: write # lets the deploy action prove where the artifact came from
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the live site serves the page that was built
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEX_SHA256: ${{ needs.build.outputs.index_sha256 }}
        run: bash scripts/verify-site.sh "${PAGE_URL}" "${INDEX_SHA256}"
