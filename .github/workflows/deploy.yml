name: deploy

# The deploy gate. Today it only proves the gate works: the job waits for the
# owner's approval in the protected `prod` environment, and only then can it assume
# the portfolio-apply role (whose trust policy accepts nothing else). The real
# deployment (image digest, tofu apply of the prod root) is added in task 15.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: gate (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod # waits for the owner's approval, main branch only
    permissions:
      contents: read # default, stated for clarity
      id-token: write # trade the OIDC token for AWS credentials, nothing else
    steps:
      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A secret on purpose: GitHub masks it everywhere in the public logs.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/portfolio-apply
          role-session-name: deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text
