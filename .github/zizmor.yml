# Require every action to be pinned to a full commit SHA (no tags, no branches).
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # GitHub added a `$/...` form for calling a workflow of the same repository, and zizmor prefers
  # it to `./...`. actionlint (a required check, checked on 1.7.12) rejects `$/...`, while `./...`
  # is valid GitHub syntax, so these workflows keep `./`. Remove this when actionlint accepts `$/`.
  self-repository:
    ignore:
      - build.yml
      - release.yml
