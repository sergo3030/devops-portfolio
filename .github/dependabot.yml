# Dependabot version updates. Weekly, grouped, with a cooldown so brand-new
# releases wait a week. Ecosystems are added when their manifests first exist:
#   npm -> task 12. (opentofu was due in task 6 and is added with docker in task 11.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: opentofu
    directories:
      - /infra/bootstrap
      - /infra/github
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      opentofu:
        patterns: ["*"]
    commit-message:
      prefix: "chore(infra)"
