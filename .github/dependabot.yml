# Dependabot version updates. Weekly, grouped, with a cooldown so brand-new
# releases wait a week. Ecosystems are added when their manifests first exist:
#   opentofu -> task 6, docker -> task 11, npm -> task 12.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
